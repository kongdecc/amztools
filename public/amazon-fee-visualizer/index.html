<script>
const groups=[
 {title:'基础规则',items:[{id:'size',name:'尺寸与发货重量',files:['商品尺寸和体积.png','体积重量.png','发货重量.png','商品尺寸分段.png'],done:true}]},
 {title:'配送与包装',items:[{id:'fba',name:'2026 美国 FBA 配送费',files:['2026 年美国亚马逊物流配送费用变更1.png','2026 年美国亚马逊物流配送费用变更2.png','2026 年美国亚马逊物流配送费用变更3.png','2026 年美国亚马逊物流配送费用变更4.png','2026 年美国低价商品亚马逊物流配送费用.png'],done:true},{id:'sipp',name:'SIPP 自有包装配送费',files:['自有包装发货SIPP亚马逊物流配送费用.png'],done:true},{id:'mcf',name:'多渠道配送费用',files:['多渠道配送订单的配送费用.png'],done:true}]},
 {title:'库存与仓储',items:[{id:'storage',name:'月度库存仓储费',files:['月度库存仓储费.png'],done:true},{id:'aged',name:'超龄库存附加费',files:['超龄库存附加费.png'],done:true},{id:'lowstock',name:'低库存水平费用',files:['低库存水平费用.png'],done:true}]},
 {title:'入库',items:[{id:'placement',name:'入库配置服务费',files:['亚马逊物流入库配置服务费.png'],done:true},{id:'defect',name:'入库缺陷处理费',files:['入库缺陷处理费.png'],done:true}]},
 {title:'售后与处理',items:[{id:'removal',name:'移除订单费用',files:['亚马逊物流移除订单费用.png'],done:true},{id:'disposal',name:'弃置订单费用',files:['亚马逊物流弃置订单费用.png'],done:true},{id:'refund',name:'退款管理费用',files:['退款管理费用.png'],done:true},{id:'extra',name:'特大号处理费',files:['特大号处理费.png'],done:true}]}
];
const all=groups.flatMap(g=>g.items.map(item=>({...item,group:g.title})));let selected='size';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sources(files){return '<div class="source">'+files.map(f=>`<a href="${encodeURIComponent(f)}" target="_blank" rel="noopener">↗ ${esc(f)}</a>`).join('')+'</div>';}
function renderNav(){const q=document.getElementById('search').value.trim().toLowerCase();const html=groups.map(g=>{const items=g.items.filter(i=>i.name.toLowerCase().includes(q)||g.title.toLowerCase().includes(q));return items.length?`<div class="nav-group">${g.title}</div>${items.map(i=>`<button class="nav-item ${i.id===selected?'active':''}" data-id="${i.id}"><span>${i.name}</span><small>${i.done?'可计算':'即将开放'}</small></button>`).join('')}`:''}).join('');document.getElementById('nav').innerHTML=html||'<div class="empty">没有匹配的模块</div>';document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.id;render();}));}
function render(){
 const item=all.find(i=>i.id===selected);
 const page={size:[()=>sizeHTML(item),()=>initSize(),'尺寸规则','确定商品尺寸、体积和发货重量。'],fba:[()=>fbaHTML(),()=>initFba(),'2026 费率','按商品类别、售价和发货重量查询配送费。'],sipp:[()=>sippHTML(),()=>initSipp(),'2026 费率','查询自有包装配送费折扣和包装费。'],mcf:[()=>mcfHTML(),()=>initMcf(),'旺季费率','查询多渠道配送订单费用。'],storage:[()=>storageHTML(),()=>initStorage(),'月度费率','估算月度库存仓储费用。'],aged:[()=>agedHTML(),()=>initAged(),'2026 费率','按库龄估算超龄库存附加费。'],lowstock:[()=>lowstockHTML(),()=>initLowstock(),'2026 费率','按历史供货天数估算低库存费用。'],placement:[()=>placementHTML(),()=>initInbound('placement'),'2026 费率','查询入库配置服务费区间。'],defect:[()=>defectHTML(),()=>initInbound('defect'),'2026 费率','查询入库缺陷处理费。'],removal:[()=>handlingHTML('removal'),()=>initHandling('removal'),'逐件费率','估算商品移除订单费用。'],disposal:[()=>handlingHTML('disposal'),()=>initHandling('disposal'),'逐件费率','估算商品弃置订单费用。'],refund:[()=>refundHTML(),()=>initRefund(),'退款规则','估算退款管理费用。'],extra:[()=>extraHTML(),()=>initExtra(),'附加费率','估算特大号商品的附加处理费。']}[item.id];
 document.getElementById('sectionTitle').textContent=item.group;
 document.getElementById('sectionSubtitle').textContent=page?page[3]:'相关费用查询功能即将开放。';
 const status=document.getElementById('sectionStatus');status.textContent=page?page[2]:'即将开放';status.classList.toggle('pending',!item.done);
 document.getElementById('content').innerHTML=page?page[0]():pendingHTML(item);
 renderNav();if(page){page[1]();document.querySelectorAll('#content input,#content select').forEach(control=>control.addEventListener('input',()=>document.querySelectorAll('#content .error').forEach(error=>error.textContent='')));const actions=document.querySelector('#content .actions');if(actions){const button=document.createElement('button');button.type='button';button.className='reset-button';button.textContent='重置';button.addEventListener('click',render);actions.insertBefore(button,actions.children[1]||null);}}
}
function initSize(){
 document.querySelector('#content .grid').insertAdjacentHTML('beforebegin',unitControlsHTML('size'));
 initUnitControls('size',['dim1','dim2','dim3'],['weight'],()=>document.getElementById('results').classList.remove('visible'));
 document.getElementById('calculate').addEventListener('click',()=>{calculate();const out=document.getElementById('results');if(out.classList.contains('visible')){const dimensions=['dim1','dim2','dim3'].map(sizeInputNumber);const weight=sizeInputNumber('weight');const m=fbaMeasure(dimensions,weight);out.insertAdjacentHTML('afterbegin',unitResultLine('size',dimensions,m.ship));}});
}
function pendingHTML(i){return `<h3>${esc(i.name)}</h3><p class="card-intro muted">费用查询功能即将开放。</p>`;}
function sizeHTML(i){return `<h3>商品尺寸与发货重量</h3><p class="card-intro muted">输入包装后尺寸和商品重量，查看尺寸分段、体积重量与发货重量。</p><div class="grid"><div class="field"><label for="dim1">包装尺寸 1 · 英寸</label><input id="dim1" type="number" min="0" step="any" inputmode="decimal" placeholder="例如 13.8"></div><div class="field"><label for="dim2">包装尺寸 2 · 英寸</label><input id="dim2" type="number" min="0" step="any" inputmode="decimal" placeholder="例如 9"></div><div class="field"><label for="dim3">包装尺寸 3 · 英寸</label><input id="dim3" type="number" min="0" step="any" inputmode="decimal" placeholder="例如 0.7"></div><div class="field"><label for="weight">商品重量 · 磅</label><input id="weight" type="number" min="0" step="any" inputmode="decimal" placeholder="例如 0.18"></div></div><div class="actions"><button class="primary" id="calculate">计算尺寸分段</button><span class="hint">1 磅 = 16 盎司；尺寸将自动排序</span></div><div id="error" class="error" role="alert"></div><div id="results" class="results" aria-live="polite"></div><details><summary>规则说明与计算口径</summary><p>按包装后的最长、次长、最短边测量。围长 = 2 × (次长边 + 最短边)；体积 = 三边相乘；立方英尺 = 立方英寸 ÷ 1,728。</p><p>体积重量 = 长 × 宽 × 高 ÷ 139；计算大件体积重量时，次长边和最短边不足 2 英寸的按 2 英寸。尺寸分段按 2026 年 1 月 15 日起的规则。</p><p>小号标准尺寸使用商品重量；大号标准尺寸、大件及不超过 150 磅的超大件按商品重量与体积重量的较大值判断发货重量。大件及超大件还可能因尺寸而被分到更高分段。</p></details><details><summary>适用范围</summary><p>适用于美国站 FBA 费用预估。亚马逊实测值及特殊配送计划可能改变实际计费结果。</p></details>`;}
function fmt(n,d=2){return Number(n.toFixed(d)).toLocaleString('en-US',{maximumFractionDigits:d});}
function calculate(){const vals=['dim1','dim2','dim3','weight'].map(sizeInputNumber);const err=document.getElementById('error');const out=document.getElementById('results');if(vals.some((v,idx)=>!Number.isFinite(v)||v<=0||document.getElementById(['dim1','dim2','dim3','weight'][idx]).value.trim()==='')){err.textContent='请填写三个大于 0 的包装尺寸和商品重量。';out.classList.remove('visible');return;}err.textContent='';const [L,M,S]=vals.slice(0,3).sort((a,b)=>b-a),actual=vals[3],girth=2*(M+S),lengthGirth=L+girth,volume=L*M*S,standardDim=volume/139,bulkyDim=L*Math.max(M,2)*Math.max(S,2)/139,standardCompare=Math.max(actual,standardDim),bulkyCompare=Math.max(actual,bulkyDim),oz=actual*16;let tier,reason,ship,dimWeight;
 if(oz<=16&&L<=15&&M<=12&&S<=.75){tier='小号标准尺寸';reason='商品重量不超过 16 盎司，三边均符合小号标准尺寸。';ship=actual;dimWeight=standardDim;}
 else if(standardCompare<=20&&L<=18&&M<=14&&S<=8){tier='大号标准尺寸';reason='计费比较重量不超过 20 磅，三边均符合大号标准尺寸。';ship=standardCompare;dimWeight=standardDim;}
 else if(bulkyCompare<=50&&L<=37&&M<=28&&S<=20&&lengthGirth<=130){tier='小号大件';reason='比较重量、三边及长度加围长均符合小号大件条件。';ship=bulkyCompare;dimWeight=bulkyDim;}
