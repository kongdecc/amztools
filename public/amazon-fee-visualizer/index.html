function overview(){const quick=[['配送费','按尺寸、发货重量、售价区间、季节和服装属性计费','delivery'],['月度仓储费','按每立方英尺、季节与仓储利用率计费','storage'],['长期仓储费','按月份和尺寸查看费用','longStorage'],['超龄库存附加费','库存达到 181 天后，按库龄和占用体积计费','aging'],['入库配置费','单点入仓、部分拆分或优化拆分对应不同费率','inbound'],['SIPP','认证标准尺寸商品折扣；未认证大件可能产生包装费','sipp'],['低库存费','按历史供货天数查看费用','other'],['特大号处理费','按重量查看附加费','oversize']];return `<div class="hero"><div><div class="topline" style="color:#83d8dc">2026 年美国站 · 费用查询工具</div><h2>美国站 FBA 费用速查</h2><p>按费用类型查看费率、分段和适用条件。</p></div></div><div class="stats"><div class="stat"><div class="k">燃油及物流附加费</div><strong>3.5%</strong><em>2026-04-17 起，叠加于 FBA 配送费</em></div><div class="stat"><div class="k">2026 假日旺季</div><strong>10/15</strong><em>至 2027-01-14</em></div><div class="stat"><div class="k">低库存触发线</div><strong>&lt; 28 天</strong><em>30 天与 90 天指标均低于门槛</em></div><div class="stat"><div class="k">超龄库存起点</div><strong>181 天</strong><em>每月 15 日快照评估</em></div></div>${lookupPanel()}${panel('探索费用类别','选择费用类别查看费率列表',`<div class="notes-grid">${quick.filter(x=>match(x[0],x[1])).map(x=>`<div class="mini" role="button" tabindex="0" data-go="${x[2]}" style="cursor:pointer"><span class="pill">查看费率 ↗</span><p><b>${x[0]}</b></p><p>${x[1]}</p></div>`).join('')||noData()}</div>`)}${panel('使用时注意','这些规则会改变费用的最终金额',`<div class="callout">配送费列表展示价目表费率；2026 年 4 月 17 日起的 3.5% 燃油及物流附加费需额外计入。公式型费率保留完整计算公式。仓储费按每立方英尺计，不能与按件费用直接相加。</div>`)}`}
function delivery(){
  let rows=DATA.delivery.filter(x=>x.band===state.band&&String(x.apparel)===state.apparel&&x.season===state.season&&String(x.year)===state.year&&(state.size==='全部尺寸'||x.size===state.size)&&match(x.size,x.weight,x.band,x.fee.raw));

  let comparisons=state.season==='常规季'&&state.year==='2026'?rows.map(x=>({now:x,old:DATA.delivery.find(y=>y.year===2025&&y.season==='常规季'&&y.apparel===x.apparel&&y.band===x.band&&y.size===x.size&&y.weight===x.weight)})).filter(x=>x.old):[];
  let compare=comparisons.length?panel('与 2025 常规季比较','按所选条件逐项比较起始费率',`<div class="fee-list"><div class="fee-list-head compare-head"><span>尺寸分段 / 发货重量</span><span>2025</span><span>2026</span></div>${comparisons.map(({now,old})=>`<div class="fee-list-row compare-row-list"><span class="fee-condition"><b>${esc(now.size)}</b><small>${esc(now.weight)}</small></span><span>${fmt(old.fee.min)}</span><strong>${fmt(now.fee.min)}</strong></div>`).join('')}</div>`):'';
  return `${lookupPanel()}${panel('配送费率',`${rows.length} 条结果 · 美元 / 件`,filters+(rows.length?list:noData())+`<div class="callout">2026 常规季：1 月 15 日至 10 月 14 日；旺季：10 月 15 日至 2027 年 1 月 14 日。2026 费率不含 3.5% 燃油及物流附加费。公式型费率在列表中完整展示。</div>`)}${compare}`;
}
function storage(){
  let rows=DATA.storage.filter(x=>x.season===state.storageSeason&&x.size===state.storageSize&&match(x.utilization,x.size));
  let list=`<div class="fee-list"><div class="fee-list-head storage-head"><span>仓储利用率</span><span>基础费</span><span>附加费</span><span>合计</span></div>${rows.map(x=>`<div class="fee-list-row storage-row"><span class="fee-condition">${esc(x.utilization)}</span><span>${fmt(x.base)}</span><span>${fmt(x.extra)}</span><strong>${fmt(x.total)}</strong></div>`).join('')}</div>`;

function longStorage(){

}
function aging(){
  let rows=DATA.aging.filter(x=>match(x.age,x.fee.raw));

}
function inbound(){
  let rows=DATA.inbound.filter(x=>match(x.size,x.weight,x.single.raw,x.partial?.raw));

function sipp(){

function syncFromLookup(){for(const key of ['band','apparel','season','year'])state[key]=lookup[key]};function syncToLookup(){for(const key of ['band','apparel','season','year'])lookup[key]=state[key]};const renderers={overview,delivery,storage,longStorage,aging,inbound,sipp,other,oversize,sizes};function render(){let p=pages.find(x=>x[0]===page);$('#pageTitle').textContent=p[2];$('#pageSubtitle').textContent=p[3];$('#nav').innerHTML=pages.map(x=>`<button data-page="${x[0]}" class="${page===x[0]?'active':''}"><span class="icon">${x[1]}</span>${x[2]}</button>`).join('');$('#content').innerHTML=renderers[page]();renderLookup();}document.addEventListener('click',e=>{let target=e.target.closest('[data-page],[data-go]');if(target){page=target.dataset.page||target.dataset.go;if(page==='delivery')syncFromLookup();render();window.scrollTo({top:0,behavior:'smooth'})}});document.addEventListener('click',e=>{if(e.target.closest('[data-lookup-reset]')){for(const key of ['weight','length','width','height'])lookup[key]='';render()}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-go]')){e.preventDefault();page=e.target.dataset.go;if(page==='delivery')syncFromLookup();render()}});document.addEventListener('change',e=>{if(e.target.dataset.key){state[e.target.dataset.key]=e.target.value;if(e.target.dataset.key==='season'&&state.season==='旺季')state.year='2026';if(page==='delivery')syncToLookup();render()}});document.addEventListener('input',e=>{if(e.target.dataset.lookup){lookup[e.target.dataset.lookup]=e.target.value;renderLookup()}});document.addEventListener('change',e=>{if(e.target.dataset.lookup){lookup[e.target.dataset.lookup]=e.target.value;if(lookup.season==='旺季')lookup.year='2026';if(page==='delivery'&&['band','apparel','season','year'].includes(e.target.dataset.lookup)){syncFromLookup();render()}else if(e.target.dataset.lookup==='season')render();else renderLookup()}});$('#search').addEventListener('input',e=>{search=e.tar
